# Proxy cache zone for Next.js optimized images
proxy_cache_path /var/cache/nginx/next_images levels=1:2 keys_zone=NEXT_IMAGES:50m max_size=2g inactive=365d use_temp_path=off;

# ===== Non-www: HTTP → HTTPS (301) =====
server {
    listen 80;
    listen [::]:80;
    server_name koikoitravel.com;
    return 301 https://koikoitravel.com$request_uri;
}

# ===== HTTPS main site (frontend :3000 + API :5000 + images) =====
server {
    listen 443 ssl;
    http2 on;
    server_name koikoitravel.com;

    ssl_certificate     /etc/letsencrypt/live/koikoitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koikoitravel.com/privkey.pem;

    client_max_body_size 50m;

    # Gzip settings for fast transmission
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Image Optimization Proxy Cache (Instant <5ms image delivery)
    location /_next/image {
        proxy_cache NEXT_IMAGES;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Static JS/CSS Assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }j

    # Static media files served from backend public folder
    location ~* ^/(content|india-tour|indai|india|spiritual|wildlife|taj-mahal|desert-safari|golden-triangle|heritage-and-culture|hill-station|honeymoon|ayurveda-yoga|quotations|documents|images|user|destinationImage|3-days-delhit-agra-jaipur-tirp-golden-triangle)/.*\.(webp|jpg|jpeg|png|gif|svg|avif|ico|pdf|docx|zip)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===== www.koikoitravel.com → koikoitravel.com (301) =====
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    http2 on;
    server_name www.koikoitravel.com;

    ssl_certificate     /etc/letsencrypt/live/koikoitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koikoitravel.com/privkey.pem;

    return 301 https://koikoitravel.com$request_uri;
}

# ===== api.koikoitravel.com → backend (:5000) =====
server {
    listen 80;
    listen [::]:80;
    server_name api.koikoitravel.com;
    return 301 https://api.koikoitravel.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.koikoitravel.com;

    ssl_certificate     /etc/letsencrypt/live/koikoitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koikoitravel.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
