# ===== Non-www: HTTP → HTTPS (301) =====
server {
    listen 80;
    listen [::]:80;
    server_name koikoitravel.com;
    return 301 https://koikoitravel.com$request_uri;
}

# ===== HTTPS main site (frontend :3000 + API :5000 + images) =====
server {
    listen 443 ssl;
    http2 on;
    server_name koikoitravel.com;

    ssl_certificate     /etc/letsencrypt/live/koikoitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koikoitravel.com/privkey.pem;

    client_max_body_size 50m;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static media files served from backend public folder
    location ~* ^/(content|india-tour|indai|india|spiritual|wildlife|taj-mahal|desert-safari|golden-triangle|heritage-and-culture|hill-station|honeymoon|ayurveda-yoga|quotations|documents|images|user|destinationImage|3-days-delhit-agra-jaipur-tirp-golden-triangle)/.*\.(webp|jpg|jpeg|png|gif|svg|avif|ico|pdf|docx|zip)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===== www.koikoitravel.com → koikoitravel.com (301) =====
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    http2 on;
    server_name www.koikoitravel.com;

    ssl_certificate     /etc/letsencrypt/live/koikoitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koikoitravel.com/privkey.pem;

    return 301 https://koikoitravel.com$request_uri;
}

# ===== api.koikoitravel.com → backend (:5000) =====
server {
    listen 80;
    listen [::]:80;
    server_name api.koikoitravel.com;
    return 301 https://api.koikoitravel.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.koikoitravel.com;

    ssl_certificate     /etc/letsencrypt/live/koikoitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koikoitravel.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
